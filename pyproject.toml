[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "select-football"
version = "0.1.0"
description = "Custom fantasy football league scoring and reporting"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tenacity>=8.3",
    "jinja2>=3.1",
    "structlog>=24.1",
    "click>=8.1",
    "python-dotenv>=1.0",
    "xlrd>=2.0.2",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
    "streamlit>=1.35",
    "altair>=5.0",
    "blinker>=1.8",
    "cachetools>=5.0",
    "httptools>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]

[project.scripts]
sync-scores = "select_football.jobs.sync_scores:main"
send-report = "select_football.jobs.send_report:main"

[tool.hatch.build.targets.wheel]
packages = ["select_football"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=select_football --cov-report=term-missing"
